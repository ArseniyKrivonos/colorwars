Вот обновленный HTML-документ, реализующий игру «Цветные Войны» с полем 5x5, улучшенной анимацией размножения и светлой кремовой палитрой для нейтральных клеток.
```html
<!DOCTYPE html>
<html lang="ru">

<style>
* {

    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;

}
/* СТАРТОВЫЙ ЭКРАН */

/* ИГРОВОЙ КОНТЕЙНЕР */

    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 20px max(12px, env(safe-area-inset-bottom));

}
#board {
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    max-width: 560px;
    max-height: 560px;

}
/* динамическая сетка: 8 или 5 */
.board-grid-8 {
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
}

    grid-template-columns: repeat(5, 1fr);

}
.cell {
    position: relative;
    border-radius: 24px;
    background: #fff8ed;  /* кремовый светлый оттенок для незанятых */
    border: 2px solid #fff0da;
    transition: background 0.18s, transform 0.08s;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 10px 16px -6px rgba(0,0,0,0.15);
}
.cell:active {
    transform: scale(0.96);
}
/* занятые клетки — насыщенные, но приятные */
.cell.player {
    background: #5f8aff;
    background: linear-gradient(145deg, #7c9eff, #4a6ee0);
    border-color: #fff0c0;
    box-shadow: 0 0 12px rgba(79, 114, 255, 0.4);
}
.cell.bot {
    background: #ff7b92;
    background: linear-gradient(145deg, #ff93aa, #f75c7c);
    border-color: #ffe0c0;
    box-shadow: 0 0 12px rgba(255, 90, 120, 0.4);
}
/* убираем подсветку контура после хода — больше нет can класса */
.dots {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    pointer-events: none;
}
.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff7e8;
    box-shadow: 0 0 8px rgba(255,235,170,0.8);
    animation: dotAppear 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes dotAppear {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}
/* АНИМАЦИЯ РАЗМНОЖЕНИЯ/ВЗРЫВА — поэтапное движение "волны" */
.explode-wave {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    pointer-events: none;
    z-index: 5;
}
.wave-particle {
    position: absolute;
    width: 20%;
    height: 20%;
    background: radial-gradient(circle, #fffbc2, #ffdb7e);
    border-radius: 50%;
    filter: blur(3px);
    animation: waveFly 0.28s forwards ease-out;
}
@keyframes waveFly {
    0% { transform: scale(0.3) translate(0,0); opacity: 0.9; }
    100% { transform: scale(1.8) translate(var(--tx, 0), var(--ty, 0)); opacity: 0; }
}
/* модалка конца */
.game-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(12px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

    background: #fff6ea;

}

    font-size: 38px;

}
.modal-btn {
    background: #cd8b3c;

    color: white;
    margin-top: 28px;
    cursor: pointer;
}
@media (max-width: 540px) {
    .dot { width: 9px; height: 9px; }
    #board { gap: 7px; }
    .cell { border-radius: 18px; }
}
</style>

<body>
<div id="app">
    <!-- стартовый экран с выбором режима 5x5 / 8x8 -->
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <div class="start-title">COLOR WARS</div>
            <div class="start-sub">⚡ ЗАХВАТИ ВСЁ ПОЛЕ ⚡</div>
            <div class="mode-switch">
                <button class="mode-btn" data-mode="5">5x5 ⚡</button>
                <button class="mode-btn" data-mode="8">8x8 🎯</button>
            </div>
            <div style="font-weight:600; margin: 6px 0 0;">сложность</div>
            <div class="difficulty-panel" id="startDiffPanel">
                <button class="diff-btn" data-diff="easy">🍃 ЛЕГКО</button>
                <button class="diff-btn" data-diff="medium">⚡ СРЕДНЕ</button>
                <button class="diff-btn" data-diff="hard">🔥 СЛОЖНО</button>
            </div>
            <button class="start-btn" id="startGameBtn">⚔️ НАЧАТЬ БИТВУ ⚔️</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="top-bar">
            <div class="game-title">◈ COLOR WARS ◈</div>
            <div class="stats-row">
                <div class="stat-block"><div class="stat-label">ТЫ</div><div class="stat-value" id="playerScore">1</div></div>
                <div class="stat-block"><div class="stat-label">БОТ</div><div class="stat-value" id="botScore">1</div></div>
            </div>
        </div>
        <div class="quick-controls">
            <div class="diff-tag" id="currentDiffLabel">ЛЕГКО</div>
            <button class="restart-btn" id="gameRestartBtn">↻</button>
        </div>
        <div class="turn-indicator" id="turnText">ТВОЙ ХОД</div>
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        document.body.classList.add("tg");
        try { tg.disableVerticalSwipes(); } catch(e) {}
        const viewH = tg.viewportHeight;
        document.documentElement.style.height = viewH + "px";
        document.body.style.height = viewH + "px";

        let SIZE = 8;          // по умолчанию 8, но стартовый экран выберет
        let board = [];
        let turn = "player";
        let gameOver = false;
        let currentDifficulty = "easy";
        let pendingBotTimer = null;
        let currentMode = "8";   // "5" или "8"

        // DOM
        const startScreenDiv = document.getElementById("startScreen");
        const gameContainer = document.getElementById("gameContainer");
        const boardEl = document.getElementById("board");
        const playerScoreSpan = document.getElementById("playerScore");
        const botScoreSpan = document.getElementById("botScore");
        const turnTextSpan = document.getElementById("turnText");
        const currentDiffSpan = document.getElementById("currentDiffLabel");
        const gameRestartBtn = document.getElementById("gameRestartBtn");

        const SPEED = { easy: 620, medium: 380, hard: 190 };

        function getDifficultyText() {
            if(currentDifficulty === "easy") return "🍃 ЛЕГКО";
            if(currentDifficulty === "medium") return "⚡ СРЕДНЕ";
            return "🔥 СЛОЖНО";
        }

        function initBoardBySize() {
            board = Array(SIZE).fill().map(() => Array(SIZE).fill().map(() => ({ owner: null, value: 0 })));
            // расстановка начальных клеток: левый верхний игрок, правый нижний бот
            board[0][0] = { owner: "player", value: 1 };
            board[SIZE-1][SIZE-1] = { owner: "bot", value: 1 };
        }

        function clearBotTimer() {
            if(pendingBotTimer) { clearTimeout(pendingBotTimer); pendingBotTimer = null; }
        }

        // эффект волны размножения: поэтапный "выброс" частиц в соседние клетки при взрыве
        function createWaveEffectFromCell(x, y, ownerColor = "player") {
            const cellsDiv = document.querySelectorAll("#board .cell");
            const idx = y * SIZE + x;
            if(!cellsDiv[idx]) return;
            const targetRect = cellsDiv[idx].getBoundingClientRect();
            const centerX = targetRect.left + targetRect.width/2;
            const centerY = targetRect.top + targetRect.height/2;
            // создаём 8-12 частиц, летящих наружу
            const particleCount = 10;
            for(let i=0; i<particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 45 + 20;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                const particle = document.createElement("div");
                particle.className = "wave-particle";
                particle.style.left = "50%";
                particle.style.top = "50%";
                particle.style.position = "absolute";
                particle.style.transform = "translate(-50%, -50%)";
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                cellsDiv[idx].style.position = "relative";
                cellsDiv[idx].appendChild(particle);
                setTimeout(() => { if(particle) particle.remove(); }, 300);
            }
        }

        // Cascading взрыв с поэтапными визуальными вспышками (последовательное распространение)
        async function explodeChainWithSteps(x, y, owner, visited = new Set()) {
            const key = `${x},${y}`;
            if(visited.has(key)) return;
            visited.add(key);
            const cell = board[y][x];
            if(!cell) return;
            // Сохраняем старую ценность
            const hadExplosion = (cell.value >= 4);
            if(hadExplosion) {
                // эффект волны именно в этой клетке перед взрывом
                createWaveEffectFromCell(x, y, owner);
                await new Promise(r => setTimeout(r, 28));
            }
            cell.value = 0;
            cell.owner = null;
            const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
            for(let [dx, dy] of dirs) {
                const nx = x+dx, ny = y+dy;
                if(nx>=0 && ny>=0 && nx<SIZE && ny<SIZE) {
                    const neighbor = board[ny][nx];
                    neighbor.owner = owner;
                    neighbor.value++;
                    if(neighbor.value >= 4 && !visited.has(`${nx},${ny}`)) {
                        await explodeChainWithSteps(nx, ny, owner, visited);
                    }
                }
            }
        }

        // основной экшн: добавить точку и обработать взрывы (с плавной анимацией)
        async function performActionWithAnim(x, y, owner) {
            const cell = board[y][x];
            if(!cell) return false;
            if(owner === "player" && cell.owner === "bot") return false;
            // Захват / увеличение
            cell.owner = owner;
            cell.value++;
            // легкая вспышка в клетке
            createSimpleFlash(x, y);
            if(cell.value >= 4) {
                await explodeChainWithSteps(x, y, owner, new Set());
            }
            return true;
        }

        function createSimpleFlash(x,y) {
            const cells = document.querySelectorAll("#board .cell");
            const idx = y * SIZE + x;
            if(cells[idx]) {
                const flash = document.createElement("div");
                flash.style.position = "absolute";
                flash.style.inset = "0";
                flash.style.backgroundColor = "rgba(255,255,200,0.6)";
                flash.style.borderRadius = "inherit";
                flash.style.pointerEvents = "none";
                flash.style.animation = "flashAnim 0.2s forwards";
                cells[idx].appendChild(flash);
                setTimeout(()=>flash.remove(), 220);
            }
        }

        // рендер сетки + счет + отсутствие подсветки контура (убрали can)
        async function renderGame() {
            boardEl.innerHTML = "";
            boardEl.className = SIZE === 8 ? "board-grid-8" : "board-grid-5";
            let playerCells = 0, botCells = 0;
            for(let y=0; y<SIZE; y++) {
                for(let x=0; x<SIZE; x++) {
                    const cell = board[y][x];
                    if(cell.owner === "player") playerCells++;
                    if(cell.owner === "bot") botCells++;
                    const div = document.createElement("div");
                    div.className = "cell";
                    if(cell.owner) div.classList.add(cell.owner);
                    // Без подсветки контура — условие убрано
                    const dotsWrap = document.createElement("div");
                    dotsWrap.className = "dots";
                    let val = Math.min(cell.value, 8);
                    for(let i=0; i<val; i++) {
                        const dotSpan = document.createElement("div");
                        dotSpan.className = "dot";
                        dotsWrap.appendChild(dotSpan);
                    }
                    div.appendChild(dotsWrap);
                    div.onclick = (function(xx,yy){ return function() { onCellClick(xx,yy); }; })(x,y);
                    boardEl.appendChild(div);
                }
            }
            playerScoreSpan.innerText = playerCells;
            botScoreSpan.innerText = botCells;
            turnTextSpan.innerText = (turn === "player") ? "✨ ТВОЙ ХОД ✨" : "🤖 БОТ ДУМАЕТ...";
            if(!gameOver) {
                if(playerCells === 0) endMatch("🤖 ПОБЕДА БОТА");
                else if(botCells === 0) endMatch("🏆 ТЫ ПОБЕДИЛ!");
            }
        }

        async function onCellClick(x,y) {
            if(gameOver) return;
            if(turn !== "player") return;
            const cell = board[y][x];
            if(cell.owner === "bot") return;
            const success = await performActionWithAnim(x, y, "player");
            if(!success) return;
            // проверка победы после действия
            let pCount=0, bCount=0;
            for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE;j++) {
                if(board[i][j].owner==="player") pCount++;
                if(board[i][j].owner==="bot") bCount++;
            }
            await renderGame();
            if(pCount===0 || bCount===0) {
                if(pCount===0) endMatch("🤖 ПОБЕДА БОТА");
                else if(bCount===0) endMatch("🏆 ТЫ ПОБЕДИЛ!");
                return;
            }
            turn = "bot";
            await renderGame();
            clearBotTimer();
            pendingBotTimer = setTimeout(() => botMoveAsync(), SPEED[currentDifficulty]);
        }

        async function botMoveAsync() {
            if(gameOver) return;
            if(turn !== "bot") return;
            let candidates = [];
            for(let y=0; y<SIZE; y++) {
                for(let x=0; x<SIZE; x++) {
                    const c = board[y][x];
                    if(c.owner === "bot" || c.owner === null) {
                        let score = Math.random() * 5;
                        if(currentDifficulty === "medium") score += c.value * 2.6;
                        if(currentDifficulty === "hard") {
                            score += c.value * 4.8;
                            let nearPlayer=false;
                            const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
                            for(let [dx,dy] of dirs) {
                                const nx=x+dx, ny=y+dy;
                                if(nx>=0&&ny>=0&&nx<SIZE&&ny<SIZE && board[ny][nx].owner==="player"){ nearPlayer=true; break;}
                            }
                            if(nearPlayer) score+=10;
                        } else if(currentDifficulty==="easy") score += c.value * 1.1;
                        candidates.push({x,y,score});
                    }
                }
            }
            if(candidates.length===0) { turn="player"; renderGame(); return; }
            candidates.sort((a,b)=>b.score-a.score);
            const best = candidates[0];
            await performActionWithAnim(best.x, best.y, "bot");
            let pCount=0,bCount=0;
            for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE;j++) {
                if(board[i][j].owner==="player") pCount++;
                if(board[i][j].owner==="bot") bCount++;
            }
            await renderGame();
            if(pCount===0 || bCount===0) {
                if(pCount===0) endMatch("🤖 ПОБЕДА БОТА");
                else if(bCount===0) endMatch("🏆 ТЫ ПОБЕДИЛ!");
                return;
            }
            turn = "player";
            await renderGame();
            clearBotTimer();
            pendingBotTimer = null;
        }

        function endMatch(message) {
            if(gameOver) return;
            gameOver = true;
            clearBotTimer();
            const existing = document.querySelector(".game-overlay");
            if(existing) existing.remove();
            const overlay = document.createElement("div");
            overlay.className = "game-overlay";
            overlay.innerHTML = `<div class="modern-modal"><h2>${message}</h2><div style="margin:8px 0;">Новая битва?</div><button class="modal-btn" id="rematchBtn">⚔️ СЫГРАТЬ СНОВА ⚔️</button></div>`;
            document.body.appendChild(overlay);
            document.getElementById("rematchBtn").onclick = () => { overlay.remove(); fullRestart(); };
        }

        function fullRestart() {
            gameOver = false;
            clearBotTimer();
            initBoardBySize();
            turn = "player";
            renderGame();
        }

        // запуск игры с выбором размера и сложности
        function startGameWithMode(mode, difficulty) {
            currentMode = mode;
            SIZE = (mode === "5") ? 5 : 8;
            currentDifficulty = difficulty;
            currentDiffSpan.innerText = getDifficultyText();
            initBoardBySize();
            turn = "player";
            gameOver = false;
            clearBotTimer();
            renderGame();
            startScreenDiv.classList.add("fade-out");
            setTimeout(() => {
                startScreenDiv.style.display = "none";
                gameContainer.classList.add("active");
            }, 500);
        }

        // обработка интерфейса стартового экрана
        let selectedMode = "8";
        let selectedDiff = "easy";
        const modeBtns = document.querySelectorAll(".mode-btn");
        modeBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                modeBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedMode = btn.getAttribute("data-mode");
            });
        });
        document.querySelector(".mode-btn[data-mode='8']").classList.add("active");
        const diffBtns = document.querySelectorAll("#startDiffPanel .diff-btn");
        diffBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                diffBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedDiff = btn.getAttribute("data-diff");
            });
        });
        document.querySelector("#startDiffPanel .diff-btn[data-diff='easy']").classList.add("active");
        document.getElementById("startGameBtn").onclick = () => { startGameWithMode(selectedMode, selectedDiff); };
        gameRestartBtn.onclick = () => { fullRestart(); };
        // предзагрузка стартовой отрисовки
        initBoardBySize();
        renderGame();
        gameContainer.classList.remove("active");
        startScreenDiv.style.display = "flex";
        startScreenDiv.classList.remove("fade-out");
        // добавим стиль анимации вспышки в head
        const styleAnim = document.createElement('style');
        styleAnim.textContent = `@keyframes flashAnim { 0% { opacity:0.7; transform:scale(0.9);} 100%{opacity:0; transform:scale(1.3);}}`;
        document.head.appendChild(styleAnim);
    })();
</script>
</body>
</html>
