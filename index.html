<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
/>
<title>Цветные Войны — захвати поле</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --bg1: #2b1740;
    --bg2: #4c2d67;
    --player: #5d7bff;
    --bot: #ff5c8d;
    --neutral: #fff2e0;
    --glass: rgba(255,255,255,0.12);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    background: #1e112b;
}

body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: radial-gradient(circle at top, var(--bg2), var(--bg1));
    color: white;
}

body.tg {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

.glow {
    position: absolute;
    width: 70vw;
    height: 70vw;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    filter: blur(60px);
    pointer-events: none;
}

.glow1 { top: -20vw; left: -20vw; }
.glow2 { right: -25vw; bottom: -25vw; }

.start-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: radial-gradient(ellipse at 50% 30%, #2e1a4a, #0a0512);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    opacity: 1;
}

.start-screen.fade-out {
    opacity: 0;
    pointer-events: none;
}

.start-card {
    width: min(88vw, 460px);
    background: rgba(30, 18, 48, 0.7);
    backdrop-filter: blur(20px);
    border-radius: 64px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 2rem 1.8rem 2.5rem;
    text-align: center;
    box-shadow: 0 30px 40px rgba(0,0,0,0.4);
}

.start-title {
    font-size: clamp(48px, 14vw, 82px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #FFF9C4, #FFD966, #FFB347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
}

.start-sub {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 24px;
}

.mode-switch {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 24px;
}

.mode-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 60px;
    padding: 10px 24px;
    font-weight: 800;
    font-size: 16px;
    color: #f0eef5;
    cursor: pointer;
    transition: 0.2s;
}

.mode-btn.active {
    background: #ffd85b;
    color: #24162f;
    border-color: #fff1b0;
    box-shadow: 0 0 12px rgba(255,217,0,0.5);
}

.difficulty-panel {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 20px 0 28px;
    flex-wrap: wrap;
}

.diff-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 60px;
    padding: 12px 18px;
    font-weight: 800;
    font-size: 15px;
    color: #f0eef5;
    cursor: pointer;
}

.diff-btn.active {
    background: #ffd85b;
    color: #1f112c;
    border-color: #fff1b0;
    box-shadow: 0 0 12px rgba(255,217,0,0.6);
}

.start-btn {
    background: linear-gradient(105deg, #8f6eff, #5a3bc2);
    border: none;
    border-radius: 60px;
    padding: 16px 0;
    width: 100%;
    font-size: 22px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #2e1c5a;
    transition: 0.07s linear;
}

.start-btn:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 #2e1c5a;
}

.game-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
    height: 100%;
}

.game-container.active {
    opacity: 1;
    pointer-events: auto;
}

.top {
    flex-shrink: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 8px;
    z-index: 2;
}

.title {
    text-align: center;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: 2px;
    text-shadow: 0 4px 0 rgba(0,0,0,0.25), 0 0 20px rgba(255,255,255,0.12);
}

.stats {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.card {
    flex: 1;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 8px;
    text-align: center;
}

.card-title {
    font-size: 12px;
    opacity: 0.8;
}

.card-score {
    margin-top: 4px;
    font-size: 26px;
    font-weight: 800;
}

.controls {
    display: flex;
    gap: 8px;
    padding: 0 16px 8px;
    flex-shrink: 0;
}

.btn {
    border: none;
    border-radius: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    min-height: 44px;
}

.btn:active {
    transform: scale(0.95);
}

.level {
    flex: 1;
    background: white;
    color: #24162f;
    font-size: 13px;
}

.level.active {
    background: #ffd85b;
}

.restart {
    width: 50px;
    background: #ff5d7f;
    color: white;
    font-size: 20px;
}

.turn {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    opacity: 0.9;
    margin-bottom: 6px;
    flex-shrink: 0;
}

.board-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 16px max(8px, env(safe-area-inset-bottom));
    min-height: 0;
}

#board {
    width: min(92vw, 92vh);
    height: min(92vw, 92vh);
    max-width: 620px;
    max-height: 620px;
    display: grid;
    gap: 6px;
    touch-action: manipulation;
}

.board-grid-8 {
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
}
.board-grid-5 {
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
}

.cell {
    position: relative;
    border-radius: 16px;
    background: #fff2e0;
    border: 1px solid rgba(255,255,255,0.3);
    transition: transform 0.1s, background 0.2s;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    aspect-ratio: 1 / 1;
    cursor: pointer;
}

.cell:active {
    transform: scale(0.94);
}

.cell.player {
    background: var(--player);
    border-color: #c0d4ff;
}

.cell.bot {
    background: var(--bot);
    border-color: #ffc0ce;
}

.dots {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    gap: 3px;
    padding: 12%;
    pointer-events: none;
}

.dot {
    width: 100%;
    height: 100%;
    max-width: 12px;
    max-height: 12px;
    min-width: 6px;
    min-height: 6px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
    animation: dotPop 0.2s ease-out;
}

@keyframes dotPop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}

.dots-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.dots-1 .dot { grid-column: 1; grid-row: 1; }
.dots-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.dots-2 .dot:nth-child(1) { grid-column: 1; }
.dots-2 .dot:nth-child(2) { grid-column: 2; }
.dots-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.dots-3 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
.dots-3 .dot:nth-child(2) { grid-column: 2; grid-row: 1; }
.dots-3 .dot:nth-child(3) { grid-column: 1 / span 2; grid-row: 2; justify-self: center; width: 50%; }
.dots-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.dots-4 .dot { width: 80%; height: 80%; }
.dots-4 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
.dots-4 .dot:nth-child(2) { grid-column: 2; grid-row: 1; }
.dots-4 .dot:nth-child(3) { grid-column: 1; grid-row: 2; }
.dots-4 .dot:nth-child(4) { grid-column: 2; grid-row: 2; }
.dots-5 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.dots-5 .dot:nth-child(1) { grid-column: 2; grid-row: 1; }
.dots-5 .dot:nth-child(2) { grid-column: 1; grid-row: 2; }
.dots-5 .dot:nth-child(3) { grid-column: 2; grid-row: 2; }
.dots-5 .dot:nth-child(4) { grid-column: 3; grid-row: 2; }
.dots-5 .dot:nth-child(5) { grid-column: 2; grid-row: 3; }
.dots-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
.dots-6 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
.dots-6 .dot:nth-child(2) { grid-column: 2; grid-row: 1; }
.dots-6 .dot:nth-child(3) { grid-column: 3; grid-row: 1; }
.dots-6 .dot:nth-child(4) { grid-column: 1; grid-row: 2; }
.dots-6 .dot:nth-child(5) { grid-column: 2; grid-row: 2; }
.dots-6 .dot:nth-child(6) { grid-column: 3; grid-row: 2; }
.dots-7 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.dots-7 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
.dots-7 .dot:nth-child(2) { grid-column: 3; grid-row: 1; }
.dots-7 .dot:nth-child(3) { grid-column: 1; grid-row: 2; }
.dots-7 .dot:nth-child(4) { grid-column: 2; grid-row: 2; }
.dots-7 .dot:nth-child(5) { grid-column: 3; grid-row: 2; }
.dots-7 .dot:nth-child(6) { grid-column: 1; grid-row: 3; }
.dots-7 .dot:nth-child(7) { grid-column: 3; grid-row: 3; }
.dots-8 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.dots-8 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
.dots-8 .dot:nth-child(2) { grid-column: 2; grid-row: 1; }
.dots-8 .dot:nth-child(3) { grid-column: 3; grid-row: 1; }
.dots-8 .dot:nth-child(4) { grid-column: 1; grid-row: 2; }
.dots-8 .dot:nth-child(5) { grid-column: 3; grid-row: 2; }
.dots-8 .dot:nth-child(6) { grid-column: 1; grid-row: 3; }
.dots-8 .dot:nth-child(7) { grid-column: 2; grid-row: 3; }
.dots-8 .dot:nth-child(8) { grid-column: 3; grid-row: 3; }

.explosion-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #fff9c4, #ffaa33);
    border-radius: inherit;
    animation: explosionFlashAnim 0.35s forwards;
    pointer-events: none;
    z-index: 5;
}

@keyframes explosionFlashAnim {
    0% { opacity: 1; transform: scale(0.8); background: #fff9c4; }
    50% { opacity: 0.9; transform: scale(1.2); background: #ffcc44; }
    100% { opacity: 0; transform: scale(1.5); background: #ff8800; }
}

.shrapnel {
    position: absolute;
    width: 20%;
    height: 20%;
    background: radial-gradient(circle, #ffeeaa, #ffaa44);
    border-radius: 50%;
    pointer-events: none;
    z-index: 6;
    animation: shrapnelFly 0.4s forwards ease-out;
}

@keyframes shrapnelFly {
    0% { transform: scale(0.3) translate(0, 0); opacity: 0.9; }
    100% { transform: scale(1.2) translate(var(--tx, 40px), var(--ty, 40px)); opacity: 0; }
}

.point-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,200,0.8), rgba(255,200,100,0));
    border-radius: inherit;
    animation: pointFlashAnim 0.2s forwards;
    pointer-events: none;
}

@keyframes pointFlashAnim {
    0% { opacity: 0.7; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.3); }
}

.popup {
    position: fixed;
    inset: 0;
    background: rgba(10,5,15,0.84);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.popup-card {
    width: min(90vw, 420px);
    background: white;
    color: #24162f;
    border-radius: 32px;
    padding: 28px 24px;
    text-align: center;
}

.popup-title {
    font-size: 38px;
    font-weight: 900;
    line-height: 0.9;
}

.popup-text {
    margin-top: 18px;
    color: #555;
    font-size: 18px;
    line-height: 1.5;
}

.play {
    margin-top: 22px;
    width: 100%;
    background: #6f63ff;
    color: white;
    font-size: 20px;
}

@media (max-width: 480px) {
    .card-score { font-size: 22px; }
    .dots { gap: 2px; padding: 10%; }
    #board { gap: 5px; }
    .cell { border-radius: 12px; }
}
</style>
</head>
<body>
<div id="app">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <div class="start-title">COLOR<br>WARS</div>
            <div class="start-sub">ЗАХВАТИ ВСЁ ПОЛЕ</div>
            <div class="mode-switch">
                <button class="mode-btn" data-mode="5">5x5 ⚡</button>
                <button class="mode-btn" data-mode="8">8x8 🎯</button>
            </div>
            <div class="difficulty-panel" id="startDiffPanel">
                <button class="diff-btn" data-diff="easy">ЛЕГКО</button>
                <button class="diff-btn" data-diff="medium">СРЕДНЕ</button>
                <button class="diff-btn" data-diff="hard">СЛОЖНО</button>
            </div>
            <button class="start-btn" id="startGameBtn">ИГРАТЬ</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="top">
            <div class="title">COLOR<br>WARS</div>
            <div class="stats">
                <div class="card"><div class="card-title">ТЫ</div><div class="card-score" id="playerScore">0</div></div>
                <div class="card"><div class="card-title">БОТ</div><div class="card-score" id="botScore">0</div></div>
            </div>
        </div>
        <div class="controls">
            <button class="btn level active" data-level="easy">ЛЕГКО</button>
            <button class="btn level" data-level="medium">СРЕДНЕ</button>
            <button class="btn level" data-level="hard">СЛОЖНО</button>
            <button class="btn restart" id="restart">↻</button>
        </div>
        <div class="turn" id="turnText">ТВОЙ ХОД</div>
        <div class="board-wrap">
            <div id="board"></div>
        </div>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
document.body.classList.add("tg");
try { tg.requestFullscreen(); } catch(e) {}
try { tg.disableVerticalSwipes(); } catch(e) {}
document.documentElement.style.height = tg.viewportHeight + "px";
document.body.style.height = tg.viewportHeight + "px";

let SIZE = 8;
let board = [];
let turn = "player";
let gameOver = false;
let difficulty = "easy";
let pendingEndCheck = false;
const SPEED = { easy: 850, medium: 550, hard: 350 };

const boardEl = document.getElementById("board");
const startScreen = document.getElementById("startScreen");
const gameContainer = document.getElementById("gameContainer");
const playerScoreEl = document.getElementById("playerScore");
const botScoreEl = document.getElementById("botScore");
const turnText = document.getElementById("turnText");
const restartBtn = document.getElementById("restart");

function createEmptyBoard() {
    const newBoard = [];
    for(let y = 0; y < SIZE; y++) {
        const row = [];
        for(let x = 0; x < SIZE; x++) {
            row.push({ owner: null, value: 0 });
        }
        newBoard.push(row);
    }
    return newBoard;
}

function initGame() {
    gameOver = false;
    pendingEndCheck = false;
    turn = "player";
    board = createEmptyBoard();
    render();
}

function addPointFlash(x, y) {
    const cells = document.querySelectorAll("#board .cell");
    const idx = y * SIZE + x;
    if(cells[idx]) {
        const flash = document.createElement("div");
        flash.className = "point-flash";
        cells[idx].style.position = "relative";
        cells[idx].appendChild(flash);
        setTimeout(() => flash.remove(), 200);
    }
}

function addExplosionFlash(x, y) {
    const cells = document.querySelectorAll("#board .cell");
    const idx = y * SIZE + x;
    if(cells[idx]) {
        const flash = document.createElement("div");
        flash.className = "explosion-flash";
        cells[idx].style.position = "relative";
        cells[idx].appendChild(flash);
        setTimeout(() => flash.remove(), 350);
        
        for(let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 25 + Math.random() * 45;
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist;
            const shrap = document.createElement("div");
            shrap.className = "shrapnel";
            shrap.style.left = "50%";
            shrap.style.top = "50%";
            shrap.style.transform = "translate(-50%, -50%)";
            shrap.style.setProperty('--tx', tx + 'px');
            shrap.style.setProperty('--ty', ty + 'px');
            cells[idx].appendChild(shrap);
            setTimeout(() => shrap.remove(), 400);
        }
    }
}

async function cascadeExplode(x, y, owner, visited = new Set()) {
    const key = `${x},${y}`;
    if(visited.has(key)) return;
    visited.add(key);
    const cell = board[y][x];
    if(!cell) return;
    
    if(cell.value >= 4) {
        addExplosionFlash(x, y);
        await new Promise(r => setTimeout(r, 120));
        
        cell.value = 0;
        cell.owner = null;
        
        const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
        for(const [dx, dy] of dirs) {
            const nx = x + dx;
            const ny = y + dy;
            if(nx >= 0 && ny >= 0 && nx < SIZE && ny < SIZE) {
                const neighbor = board[ny][nx];
                neighbor.owner = owner;
                neighbor.value++;
                addPointFlash(nx, ny);
                await new Promise(r => setTimeout(r, 60));
                
                if(neighbor.value >= 4 && !visited.has(`${nx},${ny}`)) {
                    await cascadeExplode(nx, ny, owner, visited);
                }
            }
        }
    }
}

async function performAction(x, y, owner) {
    const cell = board[y][x];
    if(!cell) return false;
    if(owner === "player" && cell.owner === "bot") return false;
    if(owner === "bot" && cell.owner === "player") return false;
    
    cell.owner = owner;
    cell.value++;
    addPointFlash(x, y);
    await new Promise(r => setTimeout(r, 80));
    
    if(cell.value >= 4) {
        await cascadeExplode(x, y, owner);
    }
    return true;
}

function getDotClass(value) {
    const v = Math.min(value, 8);
    if(v === 1) return "dots-1";
    if(v === 2) return "dots-2";
    if(v === 3) return "dots-3";
    if(v === 4) return "dots-4";
    if(v === 5) return "dots-5";
    if(v === 6) return "dots-6";
    if(v === 7) return "dots-7";
    return "dots-8";
}

function getCounts() {
    let playerCount = 0, botCount = 0;
    for(let i = 0; i < SIZE; i++) {
        for(let j = 0; j < SIZE; j++) {
            if(board[i][j].owner === "player") playerCount++;
            if(board[i][j].owner === "bot") botCount++;
        }
    }
    return { playerCount, botCount };
}

async function render() {
    boardEl.innerHTML = "";
    boardEl.className = SIZE === 8 ? "board-grid-8" : "board-grid-5";
    const { playerCount, botCount } = getCounts();
    
    for(let y = 0; y < SIZE; y++) {
        for(let x = 0; x < SIZE; x++) {
            const cell = board[y][x];
            const div = document.createElement("div");
            div.className = "cell";
            if(cell.owner) div.classList.add(cell.owner);
            
            const dotsContainer = document.createElement("div");
            const dotCount = Math.min(cell.value, 8);
            const dotClass = getDotClass(cell.value);
            dotsContainer.className = `dots ${dotClass}`;
            for(let i = 0; i < dotCount; i++) {
                const dot = document.createElement("div");
                dot.className = "dot";
                dotsContainer.appendChild(dot);
            }
            div.appendChild(dotsContainer);
            div.onclick = (function(xx, yy) { return () => onCellClick(xx, yy); })(x, y);
            boardEl.appendChild(div);
        }
    }
    
    playerScoreEl.textContent = playerCount;
    botScoreEl.textContent = botCount;
    turnText.textContent = turn === "player" ? "✨ ТВОЙ ХОД ✨" : "🤖 БОТ ДУМАЕТ...";
}

async function checkWinAfterDelay() {
    if(pendingEndCheck) return;
    pendingEndCheck = true;
    
    // Ждем 0.5 секунды, чтобы все анимации завершились
    await new Promise(r => setTimeout(r, 500));
    
    if(gameOver) {
        pendingEndCheck = false;
        return;
    }
    
    const { playerCount, botCount } = getCounts();
    
    if(playerCount === 0 && botCount === 0) {
        pendingEndCheck = false;
        return;
    }
    
    if(playerCount === 0) {
        gameOver = true;
        endGame("🤖 ПОБЕДА БОТА");
    } else if(botCount === 0) {
        gameOver = true;
        endGame("🏆 ТЫ ПОБЕДИЛ!");
    }
    pendingEndCheck = false;
}

let botTimer = null;
function clearBotTimer() { if(botTimer) { clearTimeout(botTimer); botTimer = null; } }

async function onCellClick(x, y) {
    if(gameOver) return;
    if(turn !== "player") return;
    
    const cell = board[y][x];
    if(cell.owner === "bot") return;
    
    const success = await performAction(x, y, "player");
    if(!success) return;
    
    await render();
    
    const { playerCount, botCount } = getCounts();
    if(playerCount === 0 || botCount === 0) {
        await checkWinAfterDelay();
        return;
    }
    
    turn = "bot";
    await render();
    clearBotTimer();
    botTimer = setTimeout(() => botMove(), SPEED[difficulty]);
}

async function botMove() {
    if(gameOver) return;
    if(turn !== "bot") return;
    
    let variants = [];
    for(let y = 0; y < SIZE; y++) {
        for(let x = 0; x < SIZE; x++) {
            const c = board[y][x];
            if(c.owner === "bot" || c.owner === null) {
                let score = Math.random() * 3;
                if(difficulty === "medium") score += c.value * 2.5;
                if(difficulty === "hard") {
                    score += c.value * 5;
                    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                    for(const [dx, dy] of dirs) {
                        const nx = x+dx, ny = y+dy;
                        if(nx>=0 && ny>=0 && nx<SIZE && ny<SIZE && board[ny][nx].owner === "player") {
                            score += 8;
                            break;
                        }
                    }
                }
                variants.push({x, y, score});
            }
        }
    }
    
    if(variants.length === 0) { turn = "player"; render(); return; }
    
    variants.sort((a,b) => b.score - a.score);
    const best = variants[0];
    
    await performAction(best.x, best.y, "bot");
    await render();
    
    const { playerCount, botCount } = getCounts();
    if(playerCount === 0 || botCount === 0) {
        await checkWinAfterDelay();
        return;
    }
    
    turn = "player";
    await render();
    clearBotTimer();
    botTimer = null;
}

function endGame(text) {
    if(gameOver) return;
    gameOver = true;
    clearBotTimer();
    const popupDiv = document.createElement("div");
    popupDiv.className = "popup";
    popupDiv.innerHTML = `
        <div class="popup-card">
            <div class="popup-title">${text}</div>
            <div class="popup-text">Начать новую битву?</div>
            <button class="btn play" id="popupRestart">СЫГРАТЬ СНОВА</button>
        </div>
    `;
    document.body.appendChild(popupDiv);
    document.getElementById("popupRestart").onclick = () => {
        popupDiv.remove();
        restartGame();
    };
}

function restartGame() {
    if(botTimer) clearTimeout(botTimer);
    initGame();
}

let selectedMode = "8";
let selectedDiff = "easy";

document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedMode = btn.getAttribute("data-mode");
    };
});
document.querySelectorAll("#startDiffPanel .diff-btn").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll("#startDiffPanel .diff-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedDiff = btn.getAttribute("data-diff");
    };
});
document.getElementById("startGameBtn").onclick = () => {
    SIZE = selectedMode === "5" ? 5 : 8;
    difficulty = selectedDiff;
    document.querySelectorAll(".level").forEach(btn => {
        btn.classList.remove("active");
        if(btn.dataset.level === difficulty) btn.classList.add("active");
    });
    initGame();
    startScreen.classList.add("fade-out");
    setTimeout(() => {
        startScreen.style.display = "none";
        gameContainer.classList.add("active");
    }, 500);
};

document.querySelectorAll(".level").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(".level").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        difficulty = btn.dataset.level;
        restartGame();
    };
});

restartBtn.onclick = () => restartGame();

initGame();
gameContainer.classList.remove("active");
startScreen.style.display = "flex";
startScreen.classList.remove("fade-out");
</script>
</body>
