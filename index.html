<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover
"
/>

<title>Color Wars</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root{

    --bg1:#efe7ff;
    --bg2:#d8c7ff;
    --bg3:#b89cff;

    --player:#79a7ff;
    --playerGlow:#9dc0ff;

    --bot:#ff89b0;
    --botGlow:#ffb1ca;

    --cell:#ffffff;
    --cellBorder:#e6ddff;

    --text:#3b2a5a;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            var(--bg1),
            var(--bg2),
            var(--bg3)
        );
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* BACKGROUND */

.bg-circle{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.45;
    pointer-events:none;
}

.bg1{
    width:55vw;
    height:55vw;
    background:#ffffff;
    top:-10vw;
    left:-10vw;
}

.bg2{
    width:60vw;
    height:60vw;
    background:#ffd2ea;
    right:-15vw;
    bottom:-15vw;
}

/* MENU */

#menu{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:24px;
}

.menu-card{

    width:min(92vw,430px);

    background:
        rgba(255,255,255,0.55);

    backdrop-filter:blur(20px);

    border:
        1px solid rgba(255,255,255,0.7);

    border-radius:40px;

    padding:30px 24px;

    box-shadow:
        0 20px 40px rgba(92,58,142,0.18);

    animation:show 0.6s ease;
}

@keyframes show{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

.logo{

    text-align:center;

    font-size:58px;
    font-weight:900;

    line-height:0.9;

    color:var(--text);

    text-shadow:
        0 5px 0 rgba(255,255,255,0.7);

}

.subtitle{

    margin-top:18px;

    text-align:center;

    color:#5f5285;

    font-size:17px;
    line-height:1.5;

}

.section-title{

    margin-top:26px;
    margin-bottom:12px;

    color:#5c4d85;

    font-size:14px;
    font-weight:800;

    letter-spacing:1px;
}

.levels{

    display:flex;
    gap:10px;
}

.level-btn{

    flex:1;

    height:52px;

    border:none;
    border-radius:18px;

    background:white;

    color:#4d3c75;

    font-weight:800;

    cursor:pointer;

    transition:0.18s;
}

.level-btn:active{
    transform:scale(0.94);
}

.level-btn.active{

    background:#7f6cff;
    color:white;

    box-shadow:
        0 10px 25px rgba(127,108,255,0.35);

}

.mode{

    width:100%;

    height:56px;

    margin-top:10px;

    border:none;
    border-radius:20px;

    background:white;

    color:#4e4173;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:0.18s;
}

.mode:active{
    transform:scale(0.97);
}

.mode.active{

    background:#ff8eb7;
    color:white;

    box-shadow:
        0 10px 25px rgba(255,142,183,0.35);

}

.start{

    width:100%;
    height:62px;

    margin-top:28px;

    border:none;
    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #7c6cff,
            #ff8db6
        );

    color:white;

    font-size:22px;
    font-weight:900;

    cursor:pointer;

    transition:0.18s;

    box-shadow:
        0 14px 35px rgba(113,92,255,0.35);

}

.start:active{
    transform:scale(0.96);
}

/* GAME */

#game{

    position:absolute;
    inset:0;

    display:none;
    flex-direction:column;

    padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(16px, env(safe-area-inset-bottom));
}

.top{

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.score{

    width:120px;

    background:
        rgba(255,255,255,0.55);

    backdrop-filter:blur(16px);

    border-radius:24px;

    padding:14px;

    text-align:center;
}

.score-title{

    font-size:13px;
    color:#6f6296;
}

.score-value{

    margin-top:4px;

    font-size:28px;
    font-weight:900;

    color:var(--text);
}

.turn{

    text-align:center;

    margin-top:12px;

    color:#5c4d84;

    font-weight:800;

    font-size:18px;
}

.board-wrap{

    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:0;
}

#board{

    width:min(88vw,88vh);
    height:min(88vw,88vh);

    display:grid;

    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    gap:10px;
}

/* CELLS */

.cell{

    position:relative;

    background:var(--cell);

    border:
        2px solid var(--cellBorder);

    border-radius:24px;

    overflow:hidden;

    transition:
        transform 0.12s,
        background 0.3s,
        box-shadow 0.3s;

    box-shadow:
        0 5px 14px rgba(120,95,165,0.08);

}

.cell:active{
    transform:scale(0.92);
}

.cell.player{

    background:#edf4ff;

    box-shadow:
        0 0 20px rgba(121,167,255,0.35);

}

.cell.bot{

    background:#fff0f5;

    box-shadow:
        0 0 20px rgba(255,137,176,0.35);

}

.cell.can{

    transform:translateY(-2px);

}

/* DOTS */

.dots{

    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:6px;
    flex-wrap:wrap;

    padding:8px;
}

.dot{

    width:12px;
    height:12px;

    border-radius:50%;

    animation:pop 0.22s ease;

}

.dot.player{

    background:var(--player);

    box-shadow:
        0 0 16px var(--playerGlow);

}

.dot.bot{

    background:var(--bot);

    box-shadow:
        0 0 16px var(--botGlow);

}

@keyframes pop{

    from{
        transform:scale(0);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* EXPLOSION */

.explode{

    animation:explode 0.35s ease;
}

@keyframes explode{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }

}

/* WIN */

#win{

    position:absolute;
    inset:0;

    background:
        rgba(255,255,255,0.55);

    backdrop-filter:blur(18px);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:20;
}

.win-card{

    width:min(88vw,400px);

    background:white;

    border-radius:34px;

    padding:34px 24px;

    text-align:center;

    box-shadow:
        0 20px 45px rgba(85,63,131,0.18);

}

.win-title{

    font-size:40px;
    font-weight:900;

    color:#48366e;
}

.win-btn{

    width:100%;
    height:60px;

    margin-top:24px;

    border:none;
    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #7d6dff,
            #ff90ba
        );

    color:white;

    font-size:20px;
    font-weight:900;
}

/* MOBILE */

@media(max-width:480px){

    .logo{
        font-size:48px;
    }

    #board{
        gap:8px;
    }

    .cell{
        border-radius:20px;
    }

    .dot{
        width:10px;
        height:10px;
    }

}

</style>
</head>

<body>

<div id="app">

    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>

    <!-- MENU -->

    <div id="menu">

        <div class="menu-card">

            <div class="logo">
                COLOR<br>
                WARS
            </div>

            <div class="subtitle">
                Захвати всё поле своим цветом.<br>
                Взрывай клетки и захватывай территорию.
            </div>

            <div class="section-title">
                СЛОЖНОСТЬ
            </div>

            <div class="levels">

                <button
                class="level-btn active"
                data-level="easy">
                    ЛЕГКО
                </button>

                <button
                class="level-btn"
                data-level="medium">
                    СРЕДНЕ
                </button>

                <button
                class="level-btn"
                data-level="hard">
                    СЛОЖНО
                </button>

            </div>

            <div class="section-title">
                РЕЖИМ
            </div>

            <button
            class="mode active">
                ИГРА ПРОТИВ БОТА
            </button>

            <button class="start" id="startBtn">
                ИГРАТЬ
            </button>

        </div>

    </div>

    <!-- GAME -->

    <div id="game">

        <div class="top">

            <div class="score">

                <div class="score-title">
                    ТЫ
                </div>

                <div class="score-value" id="playerScore">
                    1
                </div>

            </div>

            <div class="score">

                <div class="score-title">
                    БОТ
                </div>

                <div class="score-value" id="botScore">
                    1
                </div>

            </div>

        </div>

        <div class="turn" id="turnText">
            ТВОЙ ХОД
        </div>

        <div class="board-wrap">
            <div id="board"></div>
        </div>

    </div>

    <!-- WIN -->

    <div id="win">

        <div class="win-card">

            <div
            class="win-title"
            id="winText">
            </div>

            <button
            class="win-btn"
            onclick="restartGame()">
                СЫГРАТЬ СНОВА
            </button>

        </div>

    </div>

</div>

<script>

/* TELEGRAM */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

try{
    tg.requestFullscreen();
}catch(e){}

try{
    tg.disableVerticalSwipes();
}catch(e){}

/* GAME */

const SIZE = 8;

const boardEl =
document.getElementById("board");

const gameEl =
document.getElementById("game");

const menuEl =
document.getElementById("menu");

const winEl =
document.getElementById("win");

const winText =
document.getElementById("winText");

const playerScore =
document.getElementById("playerScore");

const botScore =
document.getElementById("botScore");

const turnText =
document.getElementById("turnText");

let difficulty = "easy";

let board = [];

let turn = "player";

let gameOver = false;

/* LEVELS */

document
.querySelectorAll(".level-btn")
.forEach(btn=>{

    btn.onclick = ()=>{

        document
        .querySelectorAll(".level-btn")
        .forEach(x=>
            x.classList.remove("active")
        );

        btn.classList.add("active");

        difficulty =
        btn.dataset.level;

    };

});

/* START */

document
.getElementById("startBtn")
.onclick = ()=>{

    menuEl.style.display = "none";

    gameEl.style.display = "flex";

    createGame();

};

/* CREATE */

function createGame(){

    gameOver = false;

    turn = "player";

    board = [];

    for(let y=0;y<SIZE;y++){

        let row = [];

        for(let x=0;x<SIZE;x++){

            row.push({

                owner:null,
                value:0

            });

        }

        board.push(row);

    }

    board[0][0] = {

        owner:"player",
        value:1

    };

    board[7][7] = {

        owner:"bot",
        value:1

    };

    render();

}

/* RENDER */

function render(){

    boardEl.innerHTML = "";

    let player = 0;
    let bot = 0;

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const cell =
            board[y][x];

            if(cell.owner==="player")
                player++;

            if(cell.owner==="bot")
                bot++;

            const div =
            document.createElement("div");

            div.className = "cell";

            if(cell.owner)
                div.classList.add(cell.owner);

            if(
                turn==="player" &&
                (
                    cell.owner==="player" ||
                    cell.owner===null
                )
            ){
                div.classList.add("can");
            }

            const dots =
            document.createElement("div");

            dots.className = "dots";

            for(let i=0;i<cell.value;i++){

                const dot =
                document.createElement("div");

                dot.className =
                "dot " + cell.owner;

                dots.appendChild(dot);

            }

            div.appendChild(dots);

            div.onclick =
            ()=>move(x,y);

            boardEl.appendChild(div);

        }

    }

    playerScore.textContent = player;
    botScore.textContent = bot;

    turnText.textContent =
        turn==="player"
        ? "ТВОЙ ХОД"
        : "БОТ ДУМАЕТ...";

    checkWin(player,bot);

}

/* MOVE */

function move(x,y){

    if(gameOver) return;

    if(turn!=="player") return;

    const cell =
    board[y][x];

    if(
        cell.owner!==null &&
        cell.owner!=="player"
    ) return;

    animateMove(x,y,"player");

    turn = "bot";

    setTimeout(()=>{

        botMove();

    },550);

}

/* ANIMATION */

function animateMove(x,y,owner){

    const cells =
    document.querySelectorAll(".cell");

    const index =
    y * SIZE + x;

    const cellEl =
    cells[index];

    if(cellEl){

        cellEl.classList.add("explode");

        setTimeout(()=>{

            cellEl.classList.remove("explode");

        },300);

    }

    action(x,y,owner);

}

/* ACTION */

function action(x,y,owner){

    const cell =
    board[y][x];

    cell.owner = owner;

    cell.value++;

    if(cell.value >= 4){

        explode(x,y,owner);

    }

    render();

}

/* EXPLOSION */

function explode(x,y,owner){

    board[y][x].value = 0;
    board[y][x].owner = null;

    const dirs = [

        [1,0],
        [-1,0],
        [0,1],
        [0,-1]

    ];

    for(const d of dirs){

        const nx =
        x + d[0];

        const ny =
        y + d[1];

        if(
            nx>=0 &&
            ny>=0 &&
            nx<SIZE &&
            ny<SIZE
        ){

            board[ny][nx].owner =
            owner;

            board[ny][nx].value++;

            if(
                board[ny][nx].value >= 4
            ){

                explode(nx,ny,owner);

            }

        }

    }

}

/* BOT */

function botMove(){

    if(gameOver) return;

    let moves = [];

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const c =
            board[y][x];

            if(
                c.owner===null ||
                c.owner==="bot"
            ){

                let score =
                Math.random();

                if(difficulty==="medium"){

                    score += c.value*2;

                }

                if(difficulty==="hard"){

                    score += c.value*5;

                }

                moves.push({
                    x,y,score
                });

            }

        }

    }

    moves.sort(
        (a,b)=>b.score-a.score
    );

    const best =
    moves[0];

    animateMove(
        best.x,
        best.y,
        "bot"
    );

    turn = "player";

    render();

}

/* WIN */

function checkWin(player,bot){

    if(player===0){

        finish("ПОБЕДИЛ БОТ");

    }

    if(bot===0){

        finish("ТЫ ПОБЕДИЛ");

    }

}

/* FINISH */

function finish(text){

    gameOver = true;

    winText.textContent =
    text;

    winEl.style.display =
    "flex";

}

/* RESTART */

function restartGame(){

    winEl.style.display =
    "none";

    createGame();

}

</script>

</body>
</html>
