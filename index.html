<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
/>

<title>Цветные Войны</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root{
    --bg1:#2b1740;
    --bg2:#4c2d67;

    --player:#5d7bff;
    --bot:#ff5c8d;

    --glass:rgba(255,255,255,0.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color: transparent;
    user-select:none;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    background:#1e112b;
}

body{
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at top,var(--bg2),var(--bg1));

    color:white;
}

body.tg{
    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}

#app{
    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
    position:relative;
}

.glow{
    position:absolute;
    width:70vw;
    height:70vw;
    border-radius:50%;

    background:rgba(255,255,255,0.05);
    filter:blur(60px);

    pointer-events:none;
}

.glow1{
    top:-20vw;
    left:-20vw;
}

.glow2{
    right:-25vw;
    bottom:-25vw;
}

.top{
    padding:
        max(18px, env(safe-area-inset-top))
        16px
        12px;

    z-index:2;
}

.title{
    text-align:center;

    font-size:clamp(34px, 7vw, 52px);
    font-weight:900;

    line-height:0.9;
    letter-spacing:2px;

    text-shadow:
        0 6px 0 rgba(0,0,0,0.25),
        0 0 20px rgba(255,255,255,0.12);
}

.stats{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.card{
    flex:1;

    background:var(--glass);

    backdrop-filter:blur(18px);

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius:22px;

    padding:12px;

    text-align:center;
}

.card-title{
    font-size:13px;
    opacity:0.8;
}

.card-score{
    margin-top:6px;

    font-size:28px;
    font-weight:800;
}

.controls{
    display:flex;
    gap:8px;

    padding:0 16px 10px;
}

.btn{
    border:none;

    border-radius:18px;

    font-weight:700;

    cursor:pointer;

    transition:0.15s;

    min-height:48px;
}

.btn:active{
    transform:scale(0.95);
}

.level{
    flex:1;

    background:white;
    color:#24162f;

    font-size:14px;
}

.level.active{
    background:#ffd85b;
}

.restart{
    width:54px;

    background:#ff5d7f;
    color:white;

    font-size:22px;
}

.turn{
    text-align:center;
    font-size:15px;
    font-weight:700;

    opacity:0.9;

    margin-bottom:8px;
}

.board-wrap{
    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:
        0 12px
        max(12px, env(safe-area-inset-bottom));

    min-height:0;
}

#board{
    width:min(94vw, 94vh);
    height:min(94vw, 94vh);

    max-width:700px;
    max-height:700px;

    display:grid;

    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    gap:5px;

    touch-action:manipulation;
}

.cell{
    position:relative;

    border-radius:16px;

    background:rgba(255,255,255,0.08);

    border:
        1px solid rgba(255,255,255,0.05);

    transition:
        transform 0.12s,
        background 0.2s,
        box-shadow 0.2s;

    overflow:hidden;
}

.cell:active{
    transform:scale(0.92);
}

.cell.player{
    background:var(--player);
}

.cell.bot{
    background:var(--bot);
}

.cell.can{
    box-shadow:
        0 0 0 2px rgba(255,255,255,0.18),
        0 0 14px rgba(255,255,255,0.08);
}

.dots{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:4px;

    padding:8px;
}

.dot{
    width:11px;
    height:11px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px rgba(255,255,255,0.4);
}

.popup{
    position:fixed;
    inset:0;

    background:rgba(10,5,15,0.84);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999;
}

.popup-card{
    width:min(90vw,420px);

    background:white;
    color:#24162f;

    border-radius:32px;

    padding:28px 24px;

    text-align:center;
}

.popup-title{
    font-size:38px;
    font-weight:900;

    line-height:0.9;
}

.popup-text{
    margin-top:18px;

    color:#555;

    font-size:18px;
    line-height:1.5;
}

.play{
    margin-top:22px;

    width:100%;

    background:#6f63ff;
    color:white;

    font-size:20px;
}

@media (max-width:480px){

    .card-score{
        font-size:24px;
    }

    .dot{
        width:9px;
        height:9px;
    }

    #board{
        gap:4px;
    }

    .cell{
        border-radius:13px;
    }

}

</style>
</head>

<body>

<div id="app">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="top">

        <div class="title">
            COLOR<br>
            WARS
        </div>

        <div class="stats">

            <div class="card">
                <div class="card-title">ТЫ</div>
                <div class="card-score" id="playerScore">1</div>
            </div>

            <div class="card">
                <div class="card-title">БОТ</div>
                <div class="card-score" id="botScore">1</div>
            </div>

        </div>

    </div>

    <div class="controls">

        <button class="btn level active" data-level="easy">
            ЛЕГКО
        </button>

        <button class="btn level" data-level="medium">
            СРЕДНЕ
        </button>

        <button class="btn level" data-level="hard">
            СЛОЖНО
        </button>

        <button class="btn restart" id="restart">
            ↻
        </button>

    </div>

    <div class="turn" id="turnText">
        ТВОЙ ХОД
    </div>

    <div class="board-wrap">
        <div id="board"></div>
    </div>

</div>

<div class="popup" id="popup">

    <div class="popup-card">

        <div class="popup-title">
            COLOR<br>
            WARS
        </div>

        <div class="popup-text">
            Захвати всё поле своим цветом.<br><br>

            Нажимай на свои клетки чтобы увеличивать точки.
            Когда клетка получает 4 точки —
            происходит взрыв и соседние клетки
            переходят под твой контроль.
        </div>

        <button class="btn play" id="playBtn">
            ИГРАТЬ
        </button>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

document.body.classList.add("tg");

try{
    tg.requestFullscreen();
}catch(e){}

try{
    tg.disableVerticalSwipes();
}catch(e){}

document.documentElement.style.height =
    tg.viewportHeight + "px";

document.body.style.height =
    tg.viewportHeight + "px";

const SIZE = 8;

const boardEl =
    document.getElementById("board");

const popup =
    document.getElementById("popup");

const playerScoreEl =
    document.getElementById("playerScore");

const botScoreEl =
    document.getElementById("botScore");

const turnText =
    document.getElementById("turnText");

let difficulty = "easy";

const SPEED = {
    easy:900,
    medium:450,
    hard:180
};

let board = [];

let turn = "player";

let gameOver = false;

function createGame(){

    gameOver = false;

    turn = "player";

    board = [];

    for(let y=0;y<SIZE;y++){

        let row = [];

        for(let x=0;x<SIZE;x++){

            row.push({
                owner:null,
                value:0
            });

        }

        board.push(row);
    }

    board[0][0] = {
        owner:"player",
        value:1
    };

    board[7][7] = {
        owner:"bot",
        value:1
    };

    render();
}

function render(){

    boardEl.innerHTML = "";

    let player = 0;
    let bot = 0;

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const cell = board[y][x];

            if(cell.owner === "player") player++;
            if(cell.owner === "bot") bot++;

            const div =
                document.createElement("div");

            div.className = "cell";

            if(cell.owner)
                div.classList.add(cell.owner);

            if(
                turn === "player" &&
                (
                    cell.owner === "player" ||
                    cell.owner === null
                )
            ){
                div.classList.add("can");
            }

            const dots =
                document.createElement("div");

            dots.className = "dots";

            for(let i=0;i<cell.value;i++){

                const dot =
                    document.createElement("div");

                dot.className = "dot";

                dots.appendChild(dot);

            }

            div.appendChild(dots);

            div.onclick = ()=>move(x,y);

            boardEl.appendChild(div);

        }
    }

    playerScoreEl.textContent = player;
    botScoreEl.textContent = bot;

    turnText.textContent =
        turn === "player"
        ? "ТВОЙ ХОД"
        : "БОТ ДУМАЕТ...";

    checkWin(player,bot);
}

function move(x,y){

    if(gameOver) return;

    if(turn !== "player") return;

    const cell = board[y][x];

    if(
        cell.owner !== null &&
        cell.owner !== "player"
    ) return;

    action(x,y,"player");

    turn = "bot";

    render();

    setTimeout(botMove,SPEED[difficulty]);

}

function action(x,y,owner){

    const cell = board[y][x];

    cell.owner = owner;

    cell.value++;

    if(cell.value >= 4){

        explode(x,y,owner);

    }

}

function explode(x,y,owner){

    board[y][x].value = 0;
    board[y][x].owner = null;

    const dirs = [
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    for(const d of dirs){

        const nx = x + d[0];
        const ny = y + d[1];

        if(
            nx >= 0 &&
            ny >= 0 &&
            nx < SIZE &&
            ny < SIZE
        ){

            board[ny][nx].owner = owner;

            board[ny][nx].value++;

            if(board[ny][nx].value >= 4){

                explode(nx,ny,owner);

            }

        }

    }

}

function botMove(){

    if(gameOver) return;

    let variants = [];

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            const c = board[y][x];

            if(
                c.owner === null ||
                c.owner === "bot"
            ){

                let score = Math.random();

                if(difficulty === "medium"){

                    score += c.value * 2;

                }

                if(difficulty === "hard"){

                    score += c.value * 4;

                    if(nearPlayer(x,y))
                        score += 6;

                }

                variants.push({
                    x,y,score
                });

            }

        }

    }

    variants.sort(
        (a,b)=>b.score-a.score
    );

    const best = variants[0];

    action(best.x,best.y,"bot");

    turn = "player";

    render();

}

function nearPlayer(x,y){

    const dirs = [
        [1,0],
        [-1,0],
        [0,1],
        [0,-1]
    ];

    for(const d of dirs){

        const nx = x+d[0];
        const ny = y+d[1];

        if(
            nx>=0 &&
            ny>=0 &&
            nx<SIZE &&
            ny<SIZE
        ){

            if(
                board[ny][nx].owner === "player"
            ){
                return true;
            }

        }

    }

    return false;
}

function checkWin(player,bot){

    if(player === 0){

        endGame("ПОБЕДИЛ БОТ");

    }

    if(bot === 0){

        endGame("ТЫ ПОБЕДИЛ");

    }

}

function endGame(text){

    gameOver = true;

    popup.style.display = "flex";

    popup.innerHTML = `
        <div class="popup-card">

            <div class="popup-title">
                ${text}
            </div>

            <div class="popup-text">
                Начать новую битву?
            </div>

            <button
                class="btn play"
                onclick="restartGame()"
            >
                СЫГРАТЬ СНОВА
            </button>

        </div>
    `;

}

function restartGame(){

    popup.style.display = "none";

    createGame();

}

document
.querySelectorAll(".level")
.forEach(btn=>{

    btn.onclick = ()=>{

        document
        .querySelectorAll(".level")
        .forEach(x=>
            x.classList.remove("active")
        );

        btn.classList.add("active");

        difficulty = btn.dataset.level;

        restartGame();

    };

});

document
.getElementById("restart")
.onclick = restartGame;

document
.getElementById("playBtn")
.onclick = ()=>{

    popup.style.display = "none";

    createGame();

};

createGame();

</script>

</body>
</html>
